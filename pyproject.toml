[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rage-intelligence-knowledge-core"
version = "0.1.0"
description = "Local, evidence-aware knowledge tools for RAGE Intelligence MCP."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21"]

[project.scripts]
rage-knowledge = "rage_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
